<text x="835.0" y="432.0" class="lbl" text-anchor="middle">charges</text>
<text x="30" y="756" class="leg">Cardinality:</text>
<path d="M120 752H160" class="rel"/>
<line x1="152" y1="745" x2="152" y2="759" class="rel"/>
<line x1="146" y1="745" x2="146" y2="759" class="rel"/>
