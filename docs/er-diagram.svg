<line x1="416" y1="191.0" x2="416" y2="205.0" class="rel"/>
<line x1="344" y1="440.0" x2="330" y2="432.0" class="rel"/>
<line x1="344" y1="440.0" x2="330" y2="440.0" class="rel"/>
<line x1="344" y1="440.0" x2="330" y2="448.0" class="rel"/>
<line x1="350" y1="447.0" x2="350" y2="433.0" class="rel"/>
<text x="374" y="319.0" class="lbl" text-anchor="end">recharges</text>
